<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="bench-notes — two distributions: the mean chases the outlier, the median holds">
  <style>
    .draw { animation: draw 2.2s cubic-bezier(.4,0,.2,1) .4s both; }
    .draw2 { animation: draw 2.2s cubic-bezier(.4,0,.2,1) 1.2s both; }
    .outlier { animation: pop .5s ease-out 2.2s both; }
    .meanline { animation: slide 1.4s ease-out 2.6s both; }
    .medline { animation: rise2 .8s ease-out 3.4s both; }
    @keyframes draw { from { stroke-dashoffset: 1; } }
    @keyframes pop { from { opacity: 0; transform: translateY(14px); } }
    @keyframes slide { from { opacity: 0; } }
    @keyframes rise2 { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .draw, .draw2, .outlier, .meanline, .medline { animation: none; } }
  </style>

  <rect width="1200" height="320" fill="#0b0806"/>

  <text x="60" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="52" font-weight="700" fill="#F8F5F2">bench-notes</text>
  <text x="60" y="116" font-family="ui-monospace, Menlo, monospace" font-size="17" letter-spacing="1.5" fill="#FE9106">honest benchmark methodology — one failure mode per note</text>
  <rect x="60" y="130" width="110" height="3" fill="#FE9106"/>

  <!-- runs as dots along a baseline; one outlier spikes -->
  <line x1="60" y1="240" x2="700" y2="240" stroke="#3a2c1e" stroke-width="1"/>
  <path class="draw" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"
        d="M80 236 L140 234 L200 237 L260 235 L320 236 L380 234"
        fill="none" stroke="#FE9106" stroke-width="2.4" stroke-linecap="round"/>
  <g class="outlier">
    <line x1="440" y1="236" x2="440" y2="160" stroke="#F05F03" stroke-width="2.4"/>
    <circle cx="440" cy="158" r="5" fill="#F05F03"/>
    <text x="456" y="162" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#F05F03">the hiccup</text>
  </g>
  <path class="draw2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"
        d="M500 235 L560 236 L620 234 L680 236"
        fill="none" stroke="#FE9106" stroke-width="2.4" stroke-linecap="round"/>

  <!-- mean dragged up, median unmoved -->
  <g class="meanline">
    <line x1="80" y1="205" x2="680" y2="205" stroke="#5c4c3f" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="690" y="209" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#5c4c3f">mean: dragged by one bad moment</text>
  </g>
  <g class="medline">
    <line x1="80" y1="236" x2="680" y2="236" stroke="#FEAF12" stroke-width="2"/>
    <text x="690" y="240" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#FEAF12">median: the run you actually get</text>
  </g>

  <text x="60" y="300" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#6e5c50">seven notes · each with a failure example and the case where the advice inverts</text>
</svg>
